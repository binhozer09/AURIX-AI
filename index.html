<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17082e">
  <meta name="description" content="AURIX IA — sua companhia virtual inteligente.">
  <title>AURIX IA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-heart">♡</span><span>AURIX IA<small>Sua companhia virtual</small></span></a>
      <div class="top-actions"><span class="online"><i></i> Online</span><button class="icon-button" id="menuButton" aria-label="Configurações">⚙</button></div>
    </header>
    <main class="stage">
      <div class="room-glow"></div>
      <section class="avatar-stage" aria-label="AURIX, sua companhia virtual">
        <div class="avatar-halo"></div>
        <div class="avatar-figure" id="avatarFigure" aria-hidden="true"><span>👩🏻</span></div>
        <div class="speech-bubble" id="speechBubble">Oi, meu bem! 💜<br>Como posso te ajudar hoje?</div>
        <button class="dance-button" id="danceButton"><span>♬</span> Dançar</button>
      </section>
      <section class="messages" id="messages" aria-live="polite"></section>
      <section class="welcome" id="welcome"><span class="welcome-heart">♡</span><p>Estou aqui com você 💜</p></section>
    </main>
    <footer class="composer-wrap">
      <div class="plus-menu" id="plusMenu" aria-hidden="true">
        <button data-action="image">▧ <span>Enviar imagem</span></button>
        <button data-action="camera">◎ <span>Tirar foto</span></button>
        <button data-action="video">▣ <span>Enviar vídeo</span></button>
        <button data-action="gift">♔ <span>Presentear</span></button>
        <button data-action="more">✧ <span>Mais opções</span></button>
      </div>
      <div class="composer">
        <input id="fileInput" type="file" hidden multiple accept="image/*,application/pdf,text/plain,.txt,video/*">
        <input id="cameraInput" type="file" hidden accept="image/*" capture="environment">
        <input id="videoInput" type="file" hidden accept="video/*">
        <button class="attach-button" id="attachButton" aria-label="Mais opções">＋</button>
        <textarea id="messageInput" rows="1" placeholder="Digite sua mensagem..." aria-label="Digite sua mensagem"></textarea>
        <button class="voice-button" id="voiceButton" aria-label="Falar com AURIX" title="Falar com AURIX">🎙</button>
        <button class="send-button" id="sendButton" aria-label="Enviar mensagem">➤</button>
      </div>
      <div class="composer-note" id="composerNote"></div>
      <div class="attachment-list" id="attachmentList"></div>
    </footer>
  </div>
  <aside class="side-panel" id="sidePanel" aria-hidden="true">
    <div class="panel-head"><strong>AURIX IA</strong><button id="closePanel" class="icon-button" aria-label="Fechar">×</button></div>
    <button id="panelNewChat" class="panel-action">＋ Nova conversa</button>
    <p class="panel-label">CONVERSAS RECENTES</p>
    <div id="historyList" class="history-list"><span class="empty-history">Suas conversas aparecerão aqui.</span></div>
    <div class="panel-bottom">AURIX IA</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <script src="./app.js"></script>
</body>
</html>
